// TODO: Here and everywhere, s/Session/Actor to align with the glossary.

syntax = "proto3";

package ateapi;

import "google/protobuf/empty.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/agent-substrate/substrate/pkg/proto/ateapipb";


// Control is the primary RPC interface for Agentic Substrate.
service Control {
  // Get an Actor.
  rpc GetActor(GetActorRequest) returns (GetActorResponse) {}

  // Create a new Actor deriving from a given ActorTemplate.
  rpc CreateActor(CreateActorRequest) returns (CreateActorResponse) {}

  // Update mutable fields on an existing Actor.
  rpc UpdateActor(UpdateActorRequest) returns (UpdateActorResponse) {}

  // Suspend a given actor to a new snapshot.
  rpc SuspendActor(SuspendActorRequest) returns (SuspendActorResponse) {}

  // Pause a given actor and keep its snapshots on node VM.
  rpc PauseActor(PauseActorRequest) returns (PauseActorResponse) {}

  // Resume an actor from its latest snapshot.
  rpc ResumeActor(ResumeActorRequest) returns (ResumeActorResponse) {}

  // Delete an actor. Only suspended actors can be deleted.
  rpc DeleteActor(DeleteActorRequest) returns (DeleteActorResponse) {}

  // List all workers currently reflected in redis.
  rpc ListWorkers(ListWorkersRequest) returns (ListWorkersResponse) {}

  // List all actors currently reflected in redis.
  rpc ListActors(ListActorsRequest) returns (ListActorsResponse) {}

  // Create a new Atespace. Substrate-native, stored in Redis.
  rpc CreateAtespace(CreateAtespaceRequest) returns (CreateAtespaceResponse) {}

  // Get an Atespace by name.
  rpc GetAtespace(GetAtespaceRequest) returns (GetAtespaceResponse) {}

  // List all Atespaces.
  rpc ListAtespaces(ListAtespacesRequest) returns (ListAtespacesResponse) {}

  // Delete an empty Atespace. Rejects (FailedPrecondition) if any actors remain.
  rpc DeleteAtespace(DeleteAtespaceRequest) returns (DeleteAtespaceResponse) {}

  // Create an atespace-scoped ActorTemplate.
  rpc CreateActorTemplate(CreateActorTemplateRequest) returns (ActorTemplate) {}

  // Get an ActorTemplate.
  rpc GetActorTemplate(GetActorTemplateRequest) returns (ActorTemplate) {}

  // List ActorTemplates.
  rpc ListActorTemplates(ListActorTemplatesRequest) returns (ListActorTemplatesResponse) {}

  // Update an ActorTemplate.
  rpc UpdateActorTemplate(UpdateActorTemplateRequest) returns (ActorTemplate) {}

  // Delete an ActorTemplate.
  rpc DeleteActorTemplate(DeleteActorTemplateRequest) returns (google.protobuf.Empty) {}

  // Watch ActorTemplate changes after an initial snapshot.
  rpc WatchActorTemplates(WatchActorTemplatesRequest) returns (stream WatchActorTemplatesResponse) {}

  // Create a WorkerPool.
  rpc CreateWorkerPool(CreateWorkerPoolRequest) returns (WorkerPool) {}

  // Get a WorkerPool.
  rpc GetWorkerPool(GetWorkerPoolRequest) returns (WorkerPool) {}

  // List WorkerPools.
  rpc ListWorkerPools(ListWorkerPoolsRequest) returns (ListWorkerPoolsResponse) {}

  // Update a WorkerPool.
  rpc UpdateWorkerPool(UpdateWorkerPoolRequest) returns (WorkerPool) {}

  // Delete a WorkerPool.
  rpc DeleteWorkerPool(DeleteWorkerPoolRequest) returns (google.protobuf.Empty) {}

  // Watch WorkerPool changes after an initial snapshot.
  rpc WatchWorkerPools(WatchWorkerPoolsRequest) returns (stream WatchWorkerPoolsResponse) {}

  // Create a SandboxConfig.
  rpc CreateSandboxConfig(CreateSandboxConfigRequest) returns (SandboxConfig) {}

  // Get a SandboxConfig.
  rpc GetSandboxConfig(GetSandboxConfigRequest) returns (SandboxConfig) {}

  // List SandboxConfigs.
  rpc ListSandboxConfigs(ListSandboxConfigsRequest) returns (ListSandboxConfigsResponse) {}

  // Update a SandboxConfig.
  rpc UpdateSandboxConfig(UpdateSandboxConfigRequest) returns (SandboxConfig) {}

  // Delete a SandboxConfig.
  rpc DeleteSandboxConfig(DeleteSandboxConfigRequest) returns (google.protobuf.Empty) {}

  // Grant an atespace access to a worker pool.
  rpc CreateWorkerPoolGrant(CreateWorkerPoolGrantRequest) returns (WorkerPoolGrant) {}

  // Get a WorkerPoolGrant by atespace and worker pool.
  rpc GetWorkerPoolGrant(GetWorkerPoolGrantRequest) returns (WorkerPoolGrant) {}

  // List WorkerPoolGrants, optionally scoped to one atespace.
  rpc ListWorkerPoolGrants(ListWorkerPoolGrantsRequest) returns (ListWorkerPoolGrantsResponse) {}

  // Delete a WorkerPoolGrant.
  rpc DeleteWorkerPoolGrant(DeleteWorkerPoolGrantRequest) returns (google.protobuf.Empty) {}

  // Debugging: drop all data from the ate database.
  rpc DebugClear(DebugClearRequest) returns (DebugClearResponse) {}
}

enum SnapshotType {
  SNAPSHOT_TYPE_UNSPECIFIED = 0;
  SNAPSHOT_TYPE_LOCAL       = 1;
  SNAPSHOT_TYPE_EXTERNAL      = 2;
}

message ExternalSnapshotInfo {
  string snapshot_uri_prefix = 1;
}

message LocalSnapshotInfo {
  string snapshot_prefix = 1;
  // Node VMs that have local snapshots for this actor, while it's PAUSED.
  repeated string node_vms_with_local_snapshots = 2;
}

message SnapshotInfo {
  SnapshotType type = 1;
  oneof data {
    ExternalSnapshotInfo external = 2;
    LocalSnapshotInfo    local    = 3;
  }
}

// Selector matches worker pools by label.
// Only equality-based matching is supported.
message Selector {
  map<string, string> match_labels = 1;
}

message Actor {
  string actor_id = 1;
  int64  version  = 2;

  string actor_template_namespace = 3;
  string actor_template_name      = 4;

  enum Status {
    STATUS_UNSPECIFIED = 0;
    STATUS_RESUMING    = 1;
    STATUS_RUNNING     = 2;
    STATUS_SUSPENDING  = 3;
    STATUS_SUSPENDED   = 4;
    STATUS_PAUSING     = 5;
    STATUS_PAUSED      = 6;
  }
  Status status = 5;

  string ateom_pod_namespace = 6;
  string ateom_pod_name      = 7;
  string ateom_pod_ip        = 8;

  // last_snapshot
  reserved 9;
  string in_progress_snapshot = 10;
  string ateom_pod_uid        = 11;
  SnapshotInfo latest_snapshot_info = 12;

  // worker_selector is the per-actor placement constraint. The scheduler
  // evaluates the AND of this selector and the template's workerSelector to
  // find eligible pools. Set at CreateActor; may be updated at any time via
  // UpdateActor. Changes take effect on the next ResumeActor call.
  Selector worker_selector = 13;

  // worker_pool_name is the name of the WorkerPool that owns the currently
  // assigned worker, in the same namespace as ateom_pod_namespace (pool and
  // pod namespaces always match). Set by the scheduler at assignment time
  // and cleared when the worker is freed. Needed to release the worker on
  // suspend/pause since eligibility is no longer a single fixed pool
  // reference on the ActorTemplate.
  string worker_pool_name = 14;

  // The atespace this actor belongs to. Part of the actor's
  // resource identity; folded into the Redis key as actor:<atespace>:<actor_id>.
  string atespace = 15;
}

// Atespace is the isolation boundary an Actor is created into.
message Atespace {
  string name = 1;
}

// ActorRef identifies an actor: a name is only unique within its atespace.
message ActorRef {
  string atespace = 1;
  string name     = 2;
}

message CreateAtespaceRequest {
  string name = 1;
}
message CreateAtespaceResponse {
  Atespace atespace = 1;
}

message GetAtespaceRequest {
  string name = 1;
}
message GetAtespaceResponse {
  Atespace atespace = 1;
}

message ListAtespacesRequest {}
message ListAtespacesResponse {
  repeated Atespace atespaces = 1;
}

message DeleteAtespaceRequest {
  string name = 1;
}
message DeleteAtespaceResponse {}

message ActorTemplateRef {
  string atespace = 1;
  string name     = 2;
}

message ActorTemplate {
  string atespace = 1;
  string name     = 2;
  string uid = 3;
  google.protobuf.Timestamp create_time = 4;
  google.protobuf.Timestamp update_time = 5;
  int64  version  = 6;
  ActorTemplateSpec spec = 7;
  ActorTemplateStatus status = 8;
}

message ActorTemplateSpec {
  string pause_image = 1;
  repeated Container containers = 2;
  SnapshotsConfig snapshots_config = 3;
  string sandbox_class = 4;
  LabelSelector worker_selector = 5;
  repeated Volume volumes = 6;
}

message ActorTemplateStatus {
  string phase = 1;
  string golden_actor_id = 2;
  google.protobuf.Timestamp take_golden_snapshot_at = 3;
  string golden_snapshot = 4;
  repeated Condition conditions = 5;
}

message Condition {
  string type = 1;
  string status = 2;
  int64 observed_generation = 3;
  google.protobuf.Timestamp last_transition_time = 4;
  string reason = 5;
  string message = 6;
}

message Volume {
  string name = 1;
  VolumeSource volume_source = 2;
}

message VolumeSource {
  DurableDirVolumeSource durable_dir = 1;
}

message DurableDirVolumeSource {}

message VolumeMount {
  string name = 1;
  string mount_path = 2;
}

message Container {
  string name = 1;
  string image = 2;
  repeated string command = 3;
  repeated EnvVar env = 4;
  ContainerReadyz readyz = 5;
  repeated VolumeMount volume_mounts = 6;
}

message ContainerReadyz {
  HTTPGetAction http_get = 1;
}

message HTTPGetAction {
  string path = 1;
  int32 port = 2;
}

message EnvVar {
  string name = 1;
  optional string value = 2;
  EnvVarSource value_from = 3;
}

message EnvVarSource {
  SecretKeySelector secret_key_ref = 1;
}

message SecretKeySelector {
  string name = 1;
  string key = 2;
  optional bool optional = 3;
}

message SnapshotsConfig {
  string location = 1;
  string on_pause = 2;
  string on_commit = 3;
}

message LabelSelector {
  map<string, string> match_labels = 1;
  repeated LabelSelectorRequirement match_expressions = 2;
}

message LabelSelectorRequirement {
  string key = 1;
  string operator = 2;
  repeated string values = 3;
}

message CreateActorTemplateRequest {
  ActorTemplate actor_template = 1;
}

message GetActorTemplateRequest {
  ActorTemplateRef actor_template = 1;
}

message ListActorTemplatesRequest {
  string atespace = 1;
  int32 page_size = 2;
  string page_token = 3;
}
message ListActorTemplatesResponse {
  repeated ActorTemplate actor_templates = 1;
  string next_page_token = 2;
}

message UpdateActorTemplateRequest {
  ActorTemplate actor_template = 1;
  google.protobuf.FieldMask update_mask = 2;
}

message DeleteActorTemplateRequest {
  ActorTemplateRef actor_template = 1;
  int64 version = 2;
}

enum ResourceEventType {
  RESOURCE_EVENT_TYPE_UNSPECIFIED = 0;
  RESOURCE_EVENT_TYPE_CREATED = 1;
  RESOURCE_EVENT_TYPE_UPDATED = 2;
  RESOURCE_EVENT_TYPE_DELETED = 3;
}

message WatchActorTemplatesRequest {}
message WatchActorTemplatesResponse {
  ResourceEventType type = 1;
  ActorTemplate actor_template = 2;
}

message WorkerPool {
  string name = 1;
  string uid = 2;
  google.protobuf.Timestamp create_time = 3;
  google.protobuf.Timestamp update_time = 4;
  int64  version = 5;
  map<string, string> labels = 6;
  WorkerPoolSpec spec = 7;
  WorkerPoolStatus status = 8;
}

message WorkerPoolSpec {
  int32 replicas = 1;
  string ateom_image = 2;
  WorkerPoolPodTemplate template = 3;
  string sandbox_class = 4;
  string sandbox_config_name = 5;
  // deployment_atespace is where the projector materializes backing worker
  // pods. It is an implementation placement field, not WorkerPool identity.
  string deployment_atespace = 6;
}

message WorkerPoolStatus {
  int32 replicas = 1;
}

message WorkerPoolPodTemplate {
  map<string, string> node_selector = 1;
  repeated Toleration tolerations = 2;
  string priority_class_name = 3;
  NodeAffinity node_affinity = 4;
  ResourceRequirements resources = 5;
}

message Toleration {
  string key = 1;
  string operator = 2;
  string value = 3;
  string effect = 4;
  optional int64 toleration_seconds = 5;
}

message NodeAffinity {
  NodeSelector required_during_scheduling_ignored_during_execution = 1;
  repeated PreferredSchedulingTerm preferred_during_scheduling_ignored_during_execution = 2;
}

message NodeSelector {
  repeated NodeSelectorTerm node_selector_terms = 1;
}

message PreferredSchedulingTerm {
  int32 weight = 1;
  NodeSelectorTerm preference = 2;
}

message NodeSelectorTerm {
  repeated NodeSelectorRequirement match_expressions = 1;
  repeated NodeSelectorRequirement match_fields = 2;
}

message NodeSelectorRequirement {
  string key = 1;
  string operator = 2;
  repeated string values = 3;
}

message ResourceRequirements {
  map<string, string> limits = 1;
  map<string, string> requests = 2;
}

message CreateWorkerPoolRequest {
  WorkerPool worker_pool = 1;
}

message GetWorkerPoolRequest {
  WorkerPoolRef worker_pool = 1;
}

message ListWorkerPoolsRequest {
  int32 page_size = 1;
  string page_token = 2;
}
message ListWorkerPoolsResponse {
  repeated WorkerPool worker_pools = 1;
  string next_page_token = 2;
}

message UpdateWorkerPoolRequest {
  WorkerPool worker_pool = 1;
  google.protobuf.FieldMask update_mask = 2;
}

message DeleteWorkerPoolRequest {
  WorkerPoolRef worker_pool = 1;
  int64 version = 2;
}

message WatchWorkerPoolsRequest {}
message WatchWorkerPoolsResponse {
  ResourceEventType type = 1;
  WorkerPool worker_pool = 2;
}

message SandboxConfig {
  string name = 1;
  string uid = 2;
  google.protobuf.Timestamp create_time = 3;
  google.protobuf.Timestamp update_time = 4;
  int64  version = 5;
  SandboxConfigSpec spec = 6;
}

message SandboxConfigRef {
  string name = 1;
}

message SandboxConfigSpec {
  string sandbox_class = 1;
  bool default = 2;
  map<string, SandboxAssetFiles> assets = 3;
}

message SandboxAssetFiles {
  map<string, AssetFile> files = 1;
}

message AssetFile {
  string url = 1;
  string sha256 = 2;
}

message CreateSandboxConfigRequest {
  SandboxConfig sandbox_config = 1;
}

message GetSandboxConfigRequest {
  SandboxConfigRef sandbox_config = 1;
}

message ListSandboxConfigsRequest {
  int32 page_size = 1;
  string page_token = 2;
}
message ListSandboxConfigsResponse {
  repeated SandboxConfig sandbox_configs = 1;
  string next_page_token = 2;
}

message UpdateSandboxConfigRequest {
  SandboxConfig sandbox_config = 1;
  google.protobuf.FieldMask update_mask = 2;
}

message DeleteSandboxConfigRequest {
  SandboxConfigRef sandbox_config = 1;
  int64 version = 2;
}

message WorkerPoolRef {
  string name = 1;
}

// WorkerPoolGrant allows one atespace to schedule actors onto one worker pool.
message WorkerPoolGrant {
  string atespace = 1;
  string name = 2;
  string uid = 3;
  google.protobuf.Timestamp create_time = 4;
  google.protobuf.Timestamp update_time = 5;
  int64 version = 6;
  WorkerPoolRef worker_pool = 7;
}

message WorkerPoolGrantRef {
  string atespace = 1;
  string name = 2;
}

message CreateWorkerPoolGrantRequest {
  WorkerPoolGrant worker_pool_grant = 1;
}

message GetWorkerPoolGrantRequest {
  WorkerPoolGrantRef worker_pool_grant = 1;
}

message ListWorkerPoolGrantsRequest {
  // If set, list only grants for this atespace. Empty lists all grants.
  string atespace = 1;
  int32 page_size = 2;
  string page_token = 3;
}
message ListWorkerPoolGrantsResponse {
  repeated WorkerPoolGrant worker_pool_grants = 1;
  string next_page_token = 2;
}

message DeleteWorkerPoolGrantRequest {
  WorkerPoolGrantRef worker_pool_grant = 1;
  int64 version = 2;
}

message GetActorRequest {
  ActorRef actor_ref = 1;
}

message GetActorResponse {
  Actor actor = 1;
}

// Request to create a new Actor.
message CreateActorRequest {
  // The new actor's atespace and actor_id (actor_id must be a valid DNS-1123 label).
  ActorRef actor_ref = 1;

  // The namespace of the ActorTemplate to derive from.
  string actor_template_namespace = 2;

  // The name of the ActorTemplate to derive from.
  string actor_template_name = 3;

  // worker_selector sets the actor's placement constraint at creation time.
  // If empty, the actor matches any pool admitted by the template's selector.
  Selector worker_selector = 4;

  // The API-native ActorTemplate to derive from. Preferred over the legacy
  // actor_template_namespace/name fields above.
  ActorTemplateRef actor_template = 5;
}

message CreateActorResponse {
  Actor actor = 1;
}

// Request to update mutable fields on an existing Actor.
// May be called regardless of the actor's current status.
// Changes take effect on the next ResumeActor call.
message UpdateActorRequest {
  ActorRef actor_ref = 1;

  // worker_selector replaces the actor's current placement constraint.
  // Takes effect on the next ResumeActor call.
  Selector worker_selector = 2;
}

message UpdateActorResponse {
  Actor actor = 1;
}

message SuspendActorRequest {
  ActorRef actor_ref = 1;
}

message SuspendActorResponse {
  Actor actor = 1;
}

message PauseActorRequest {
  ActorRef actor_ref = 1;
}

message PauseActorResponse {
  Actor actor = 1;
}

message ResumeActorRequest {
  ActorRef actor_ref = 1;

  // If true, skip golden snapshot and boot the workload from scratch.
  bool boot = 2;
}

message ResumeActorResponse {
  Actor actor = 1;
}

message DeleteActorRequest {
  ActorRef actor_ref = 1;
}

message DeleteActorResponse {}

message ListWorkersRequest {}

message ListWorkersResponse {
  repeated Worker workers = 1;
}

// Request to list actors with pagination.
// This operation provides "soft" guarantees: actors may be missed or duplicated
// if the system state changes during pagination.
message ListActorsRequest {
  // The maximum number of actors to return. The server may enforce a hard limit
  // (e.g., 1000) regardless of the requested size.
  int32 page_size = 1;

  // An opaque pagination token obtained from a previous ListActorsResponse.
  // Empty for the first request.
  string page_token = 2;

  // If set, list only actors in this atespace (scoped SCAN actor:<atespace>:*).
  string atespace = 3;
}

// Response for a ListActors operation.
message ListActorsResponse {
  // The page of actors. This list may be empty even if there are more results.
  repeated Actor actors = 1;

  // An opaque token to retrieve the next page of results.
  // If empty, there are no more results. Clients must loop until this is empty.
  string next_page_token = 2;
}

message Worker {
  string worker_namespace = 1;
  string worker_pool      = 2;
  string worker_pod       = 3;

  string actor_namespace = 4;
  string actor_template  = 5;
  string actor_id        = 6;
  string ip              = 7;
  int64  version         = 8;
  string worker_pod_uid  = 9;
  string node_name       = 10;

  // The atespace of the actor currently running on this worker. Set when an actor
  // is assigned, cleared when freed. It is NOT the worker's own atespace.
  string actor_atespace = 11;
}

message DebugClearRequest {}

message DebugClearResponse {}

// SessionIdentity allows substrate workloads to exchange their
// infrastructure-level credentials (k8s service account token, etc.) for a
// substrate session-level credential.  A given substrate session might migrate
// between many different physical workers over the course of its lifecycle,
// whereas the session credential's identity will be stable for the life of the
// session.
//
// This service requires authentication. You can authenticate with a Kubernetes
// service account token in an `Authorization: Bearer` header, or you can
// authenticate with a Kubernetes service account certificate as an mTLS
// certificate. (Kubernetes service account certificates do not currently exist
// upstream, but we will provide a polyfill based on Pod Certificates).
//
// The broker will check that the service credentials you authenticated with
// belong to a Pod that is currently mapped to the requested session in the
// session database.
service SessionIdentity {
  // Request a Session Identity JWT.
  //
  // To call this RPC, you must be authenticated as the Kubernetes Pod that is
  // currently running the requested session.
  rpc MintJWT(MintJWTRequest) returns (MintJWTResponse);

  // Request a Session Identity Certificate. To call this RPC, you must have
  // authenticated with a client certificate, not a bearer token.
  rpc MintCert(MintCertRequest) returns (MintCertResponse);
}

message MintJWTRequest {
  repeated string audience = 1;

  string app_id     = 2;
  string user_id    = 3;
  string session_id = 4;
}

message MintJWTResponse {
  // Session JWT.  An OIDC Discovery-compatible JWT
  //
  // Claims:
  //
  // * iss: Issuer - a valid URL where a relying party can fetch the OIDC
  //   discovery documents.
  // * sub: Subject - a string expressing the identity carried in the
  // credential. Format
  //   `app/${appid}/user/${userid}/session/${sessionid}`.
  // * aud: Audience - a string identifying the service this token will be used
  //   to authenticate to.
  // * nbf: Not Before - a numeric unix timestamp
  // * exp: Expiration - a numeric unix timestamp
  // * iat: Issued At - a numeric unix timestamp
  // * `ate.dev`: Ate/Substrate Extension - JSON object
  //   * appID: (string) The Substrate App ID
  //   * userID: (string) The Substrate User ID
  //   * sessionID: (string) The Substrate Session ID
  string session_jwt = 1;
}

message MintCertRequest {
  string app_id     = 1;
  string user_id    = 2;
  string session_id = 3;

  // Request contains DER encoded bytes of a x509 certificate signing request.
  // The signer will ignore the contents of the CSR except to extract the
  // subject public key.
  bytes certificate_signing_request = 4;
}

message MintCertResponse {
  // Response contains a list of DER encoded certificates. The first entry is the
  // leaf certificate, and any remaining entries are intermediates in
  // leaf-to-root order.
  repeated bytes session_certificates = 1;
}
