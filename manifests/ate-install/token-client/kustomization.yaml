# Overlay: in-cluster clients authenticate to ateapi with a projected
# ServiceAccount token instead of a client certificate. The server always
# accepts both.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../ate-api-server.yaml
  - ../ate-controller.yaml
  - ../atelet.yaml
  - ../atenet-dns.yaml
  - ../atenet-egress.yaml
  - ../atenet-router.yaml
  - ../valkey.yaml

patches:
  - path: patches.yaml
  - target:
      group: rbac.authorization.k8s.io
      version: v1
      kind: ClusterRole
      name: ate-api-server
    patch: |-
      - op: add
        path: /rules/-
        value:
          apiGroups: ["authentication.k8s.io"]
          resources: ["tokenreviews"]
          verbs: ["create"]
