apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../token-client
  - ../kind/rustfs.yaml
  - ../kind/otel-collector.yaml
  - ../kind/prometheus.yaml

patches:
  - patch: |-
      apiVersion: apps/v1
      kind: DaemonSet
      metadata:
        name: atelet
        namespace: ate-system
      spec:
        template:
          spec:
            containers:
            - name: atelet
              args:
              - --gcp-auth-for-image-pulls=false
              - --localhost-registry-replacement=kind-registry:5000
              - --grpc-server-cred-bundle=/run/podidentity.podcert.ate.dev/credential-bundle.pem
              - --client-ca-certs=
              - --ateapi-ca-file=/run/servicedns-ca/trust-bundle.pem
              - --ateapi-use-token-auth=true
              - --ateapi-token-file=/run/ateapi-token/token
              - --credential-broker-token-issuer=$(ATE_JWT_ISSUER)
              - --credential-broker-token-audience=atelet.ate-system.svc
              - --log-level=debug
              env:
              - name: OTEL_EXPORTER_OTLP_ENDPOINT
                value: http://opentelemetry-collector.otel-system.svc:4317
              - name: OTEL_METRIC_EXPORT_INTERVAL
                value: "10000"
              - name: OTEL_METRIC_EXPORT_TIMEOUT
                value: "10000"
              - name: ATE_STORAGE_BACKEND
                value: s3
              - name: AWS_REGION
                value: us-east-1
              - name: AWS_ENDPOINT_URL
                value: http://rustfs.ate-system.svc:9000
              - name: AWS_S3_USE_PATH_STYLE
                value: "true"
              - name: AWS_ACCESS_KEY_ID
                value: rustfsadmin
              - name: AWS_SECRET_ACCESS_KEY
                value: rustfsadmin
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: ate-api-server
        namespace: ate-system
      spec:
        template:
          spec:
            containers:
            - name: ate-api-server
              env:
              - name: OTEL_EXPORTER_OTLP_ENDPOINT
                value: http://opentelemetry-collector.otel-system.svc:4317
              - name: OTEL_METRIC_EXPORT_INTERVAL
                value: "10000"
              - name: OTEL_METRIC_EXPORT_TIMEOUT
                value: "10000"
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: ate-controller
        namespace: ate-system
      spec:
        template:
          spec:
            containers:
            - name: ate-controller
              env:
              - name: OTEL_EXPORTER_OTLP_ENDPOINT
                value: http://opentelemetry-collector.otel-system.svc:4317
              - name: OTEL_METRIC_EXPORT_INTERVAL
                value: "10000"
              - name: OTEL_METRIC_EXPORT_TIMEOUT
                value: "10000"
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: atenet-router
        namespace: ate-system
      spec:
        template:
          spec:
            containers:
            - name: atenet-router
              env:
              - name: OTEL_EXPORTER_OTLP_ENDPOINT
                value: http://opentelemetry-collector.otel-system.svc:4317
