# Default values for the substrate chart.
#
# The chart requires ClusterTrustBundle, ClusterTrustBundleProjection,
# PodCertificateRequest, and the certificates.k8s.io/v1beta1 API.

# Set to true to have the chart create the release namespace.
# Off by default — most helm workflows expect the namespace to already exist
# (helm install -n <ns> --create-namespace). Enable for the generated
# manifests/ate-install/ install path (kubectl apply).
createNamespace: false

postgres:
  enabled: true
  storageSize: 1Gi
  connectionString: ""
  schema: public
  resources:
    requests:
      cpu: "1"
      memory: 1Gi
    limits:
      cpu: "2"
      memory: 2Gi

rustfs:
  enabled: true
  storageSize: 1Gi
  bucket: ate-snapshots
  accessKey: rustfsadmin
  secretKey: rustfsadmin

# atelet daemonset overrides. Defaults use the in-cluster RustFS deployment for
# snapshots. Set rustfs.enabled=false and override these fields when using
# external storage.
# extraArgs / extraEnv are appended verbatim for installer-specific knobs
# (e.g. registry replacement for kind).
atelet:
  gcpAuthForImagePulls: false
  storageBackend: s3
  extraArgs: []
  extraEnv: []

# Name of a ConfigMap in the release namespace that supplies per-environment
# overrides for ate-api-server (ATE_API_POSTGRES_CONNECTION_STRING, ...).
# Mounted via envFrom with optional=true. Created by the chart from these values.
ateApiServerEnvVarsConfigMap: ate-api-server-envvars

# OTLP export, following the OpenTelemetry SDK environment variable spec.
# endpoint applies to every signal; a signal's own endpoint overrides it.
# A signal exports only when it is enabled and resolves to an endpoint.
#
# traces.enabled and metrics.enabled set OTEL_<SIGNAL>_EXPORTER=none on the
# Go components, which do not read it yet and keep exporting; the setting
# takes effect on the router's agentgateway only. logs.enabled works in full,
# since the agentgateway access log is the only OTLP log source.
otel:
  endpoint: ""
  traces:
    enabled: true
    endpoint: ""
    samplingRatio: 0.01
  metrics:
    enabled: true
    endpoint: ""
  logs:
    enabled: true
    endpoint: ""

image:
  registry: ghcr.io/kagent-dev/substrate
  tag: ""

images:
  postgres: postgres:18.6-alpine3.24@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
  rustfs: rustfs/rustfs:v1.0.0-rc.5@sha256:b7014e0ce2bc703c1316b3ef760e29dfae61fe4a50d1a66fa89638e0f8ea211f
  awsCli: amazon/aws-cli:2.36.43@sha256:d948ee299a7ffcaec0d6052a00b9f4c513c61cacfaedfe68b098c85808394441
  agentgateway: ghcr.io/agentgateway/agentgateway:v0.0.0-alpha.9f9744cf
  busybox: busybox:1.38.0@sha256:dc2d74b28e4cf8984fa52af1f39bc7c3d9c73760b41a74d629f5d11b1ab28616
