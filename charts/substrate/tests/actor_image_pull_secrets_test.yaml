suite: atelet actor image pull Secrets
templates:
- atelet.yaml
release:
  name: custom
  namespace: custom-system
tests:
- it: mounts nothing and passes no flag by default
  documentSelector:
    path: kind
    value: DaemonSet
  asserts:
  - notExists:
      path: spec.template.spec.volumes[?(@.name == "actor-image-pull-secret-0")]
  - notExists:
      path: spec.template.spec.containers[0].volumeMounts[?(@.name == "actor-image-pull-secret-0")]
  - notContains:
      path: spec.template.spec.containers[0].args
      content: --image-pull-docker-config=/run/actor-image-pull-secrets/registry-pull/.dockerconfigjson

- it: mounts each Secret read-only and names its .dockerconfigjson to atelet
  documentSelector:
    path: kind
    value: DaemonSet
  set:
    atelet:
      actorImagePullSecrets:
      - registry-pull
      - mirror.example.com
  asserts:
  - contains:
      path: spec.template.spec.containers[0].args
      content: --image-pull-docker-config=/run/actor-image-pull-secrets/registry-pull/.dockerconfigjson
  - contains:
      path: spec.template.spec.containers[0].args
      content: --image-pull-docker-config=/run/actor-image-pull-secrets/mirror.example.com/.dockerconfigjson
  - equal:
      path: spec.template.spec.volumes[?(@.name == "actor-image-pull-secret-0")].secret.secretName
      value: registry-pull
  - equal:
      path: spec.template.spec.volumes[?(@.name == "actor-image-pull-secret-1")].secret.secretName
      value: mirror.example.com
  - equal:
      path: spec.template.spec.containers[0].volumeMounts[?(@.name == "actor-image-pull-secret-1")]
      value:
        name: actor-image-pull-secret-1
        mountPath: /run/actor-image-pull-secrets/mirror.example.com
        readOnly: true
