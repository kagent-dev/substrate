suite: PodMonitors
templates:
- podmonitors.yaml
release:
  name: custom
  namespace: custom-system
tests:
- it: renders no PodMonitors by default
  template: podmonitors.yaml
  asserts:
  - hasDocuments:
      count: 0
- it: scrapes each control plane component's metrics port
  template: podmonitors.yaml
  set:
    podMonitors:
      enabled: true
      apiVersion: azmonitoring.coreos.com/v1
  asserts:
  - hasDocuments:
      count: 4
  - isAPIVersion:
      of: azmonitoring.coreos.com/v1
  - isKind:
      of: PodMonitor
  - equal:
      path: metadata.namespace
      value: custom-system
  - equal:
      path: metadata.name
      value: custom-ate-api-server
    documentIndex: 0
  - equal:
      path: spec
      value:
        selector:
          matchLabels:
            app: ate-api-server
        podMetricsEndpoints:
        - port: prometheus
          path: /metrics
    documentIndex: 0
  - equal:
      path: spec.podMetricsEndpoints[0].port
      value: gw-metrics
    documentIndex: 1
  - equal:
      path: spec.podMetricsEndpoints[0].port
      value: stats
    documentIndex: 2
  - equal:
      path: spec.selector.matchLabels.app
      value: ate-controller
    documentIndex: 3
  - equal:
      path: spec.podMetricsEndpoints[0].port
      value: metrics
    documentIndex: 3
- it: skips ate-controller when it serves no metrics
  template: podmonitors.yaml
  set:
    podMonitors.enabled: true
    otel.metrics.enabled: false
  asserts:
  - hasDocuments:
      count: 3
  - notEqual:
      path: spec.selector.matchLabels.app
      value: ate-controller
