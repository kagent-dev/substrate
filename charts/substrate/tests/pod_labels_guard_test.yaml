suite: Pod labels selector guard
templates:
- ate-controller.yaml
tests:
- it: refuses a podLabels entry that replaces the app selector label
  set:
    podLabels:
      app: other
  asserts:
  - failedTemplate:
      errorMessage: "podLabels must not set app: it is the selector label of every workload in the chart"
