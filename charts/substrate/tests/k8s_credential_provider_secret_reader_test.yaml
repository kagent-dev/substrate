suite: k8s credential provider Secret reader binding
templates:
- k8s-credential-provider.yaml
release:
  name: substrate
  namespace: ate-system
tests:
- it: binds the reader cluster-wide by default
  asserts:
  - containsDocument:
      kind: ClusterRoleBinding
      apiVersion: rbac.authorization.k8s.io/v1
      name: k8s-credential-provider-secret-reader
      any: true
  - containsDocument:
      kind: RoleBinding
      apiVersion: rbac.authorization.k8s.io/v1
    not: true

- it: binds the reader only in the listed namespaces
  set:
    credentialProvider.rbac.namespaces: [kagent, agents-acme-x1]
  asserts:
  - containsDocument:
      kind: ClusterRoleBinding
      apiVersion: rbac.authorization.k8s.io/v1
    not: true
  - containsDocument:
      kind: ClusterRole
      apiVersion: rbac.authorization.k8s.io/v1
      name: k8s-credential-provider-secret-reader
      any: true
  - containsDocument:
      kind: RoleBinding
      apiVersion: rbac.authorization.k8s.io/v1
      name: k8s-credential-provider-secret-reader
      namespace: kagent
      any: true
  - containsDocument:
      kind: RoleBinding
      apiVersion: rbac.authorization.k8s.io/v1
      name: k8s-credential-provider-secret-reader
      namespace: agents-acme-x1
      any: true

- it: the RoleBindings name the reader and the provider's ServiceAccount
  set:
    credentialProvider.rbac.namespaces: [kagent]
  documentSelector:
    path: kind
    value: RoleBinding
  asserts:
  - equal:
      path: roleRef
      value: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: k8s-credential-provider-secret-reader}
  - equal:
      path: subjects
      value: [{kind: ServiceAccount, name: k8s-credential-provider, namespace: ate-system}]

- it: binds the reader cluster-wide with an empty list
  set:
    credentialProvider.rbac.namespaces: []
  asserts:
  - containsDocument:
      kind: ClusterRoleBinding
      apiVersion: rbac.authorization.k8s.io/v1
      name: k8s-credential-provider-secret-reader
      any: true
  - containsDocument:
      kind: RoleBinding
      apiVersion: rbac.authorization.k8s.io/v1
    not: true
