suite: atelet image credential provider
templates:
- atelet.yaml
release:
  name: custom
  namespace: custom-system
tests:
- it: renders no credential provider wiring by default
  documentSelector:
    path: kind
    value: DaemonSet
  asserts:
  - notContains:
      path: spec.template.spec.containers[0].args
      content: --image-credential-provider-config=/run/image-credential-provider/config.yaml
  - notExists:
      path: spec.template.spec.volumes[?(@.name == "image-credential-provider-bin")]

- it: mounts the node's provider config and binaries from host paths
  documentSelector:
    path: kind
    value: DaemonSet
  set:
    atelet:
      imageCredentialProviderConfig: /etc/srv/kubernetes/cri_auth_config.yaml
      imageCredentialProviderBinDir: /home/kubernetes/bin
  asserts:
  - contains:
      path: spec.template.spec.containers[0].args
      content: --image-credential-provider-bin-dir=/run/image-credential-provider/bin
  - equal:
      path: spec.template.spec.volumes[?(@.name == "image-credential-provider-bin")].hostPath.path
      value: /home/kubernetes/bin

- it: appends extraVolumes and extraVolumeMounts to atelet
  documentSelector:
    path: kind
    value: DaemonSet
  set:
    atelet:
      extraVolumes:
      - name: registry-dockerconfig
        secret:
          secretName: registry-pull-secret
      extraVolumeMounts:
      - name: registry-dockerconfig
        mountPath: /run/image-credential-provider/dockerconfig
        readOnly: true
  asserts:
  - equal:
      path: spec.template.spec.volumes[?(@.name == "registry-dockerconfig")].secret.secretName
      value: registry-pull-secret
  - equal:
      path: spec.template.spec.containers[0].volumeMounts[?(@.name == "registry-dockerconfig")].mountPath
      value: /run/image-credential-provider/dockerconfig
