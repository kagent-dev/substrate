suite: gVisor sandbox config
templates:
- sandboxconfig-gvisor.yaml
tests:
- it: fetches the gVisor releases from Google Cloud Storage by default
  asserts:
  - equal:
      path: spec.versions[1].assets.amd64.gvisor.url
      value: gs://gvisor/releases/release/20261102.0/x86_64/gvisor.tar.zstd

- it: fetches the gVisor releases from gvisorReleaseLocation, keeping each pinned sha256
  set:
    gvisorReleaseLocation: s3://mirror/gvisor/releases/release/
  asserts:
  - equal:
      path: spec.versions[0].assets.arm64.gvisor.url
      value: s3://mirror/gvisor/releases/release/20261026.0/aarch64/gvisor.tar.zstd
  - equal:
      path: spec.versions[1].assets.amd64.gvisor.url
      value: s3://mirror/gvisor/releases/release/20261102.0/x86_64/gvisor.tar.zstd
  - equal:
      path: spec.versions[1].assets.amd64.gvisor.sha256
      value: a1439ffbba7d212e0fde32ea79fa9bb51cbc4c5f6c16af1f047260290b861d42
