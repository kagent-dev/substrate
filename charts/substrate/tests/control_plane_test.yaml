suite: Control plane integration
templates:
- ate-api-server.yaml
- atelet.yaml
- k8s-credential-provider.yaml
- ate-system-networkpolicies.yaml
- rustfs.yaml
release:
  name: custom
  namespace: custom-system
tests:
- it: probes the API health listener and resolves component identities
  template: ate-api-server.yaml
  documentSelector:
    path: kind
    value: Deployment
  asserts:
  - contains:
      path: spec.template.spec.containers[0].ports
      content:
        name: health
        containerPort: 9091
  - equal:
      path: spec.template.spec.containers[0].readinessProbe.httpGet.port
      value: health
  - equal:
      path: spec.template.spec.containers[0].startupProbe.httpGet.port
      value: health
  - equal:
      path: spec.template.spec.containers[0].livenessProbe.httpGet.port
      value: health
  - contains:
      path: spec.template.spec.containers[0].args
      content: --controller-spiffe-id=spiffe://cluster.local/ns/custom-system/sa/custom-ate-controller
  - contains:
      path: spec.template.spec.containers[0].args
      content: --egress-gateway-spiffe-id=spiffe://cluster.local/ns/custom-system/sa/custom-atenet-egress
  - contains:
      path: spec.template.spec.containers[0].args
      content: --ingress-router-spiffe-id=spiffe://cluster.local/ns/custom-system/sa/custom-atenet-router
- it: lets atelet watch the configs and pools of its workers
  template: atelet.yaml
  documentSelector:
    path: kind
    value: ClusterRole
  asserts:
  - contains:
      path: rules
      content:
        apiGroups: [ate.dev]
        resources: [sandboxconfigs, workerpools]
        verbs: [get, list, watch]
- it: probes atelet health without exposing metrics on the host
  template: atelet.yaml
  documentSelector:
    path: kind
    value: DaemonSet
  asserts:
  - contains:
      path: spec.template.spec.containers[0].ports
      content:
        name: prometheus
        containerPort: 9090
        protocol: TCP
  - contains:
      path: spec.template.spec.containers[0].ports
      content:
        name: health
        containerPort: 9091
        protocol: TCP
  - equal:
      path: spec.template.spec.containers[0].readinessProbe.httpGet.port
      value: health
  - equal:
      path: spec.template.spec.containers[0].livenessProbe.httpGet.port
      value: health
- it: probes the credential provider on its health listener
  template: k8s-credential-provider.yaml
  documentSelector:
    path: kind
    value: Deployment
  asserts:
  - contains:
      path: spec.template.spec.containers[0].ports
      content:
        name: health
        containerPort: 9091
  - equal:
      path: spec.template.spec.containers[0].readinessProbe.httpGet.port
      value: health
- it: denies ingress by default in the release namespace
  template: ate-system-networkpolicies.yaml
  documentSelector:
    path: metadata.name
    value: custom-default-deny-ingress
  asserts:
  - equal:
      path: metadata.namespace
      value: custom-system
  - equal:
      path: spec.podSelector
      value: {}
  - equal:
      path: spec.policyTypes
      value: [Ingress]
  - notExists:
      path: spec.ingress
- it: permits agentgateway metrics but keeps credential provider status private
  template: ate-system-networkpolicies.yaml
  documentSelector:
    path: metadata.name
    value: custom-ate-system-observability
  asserts:
  - contains:
      path: spec.ingress[0].ports
      content:
        protocol: TCP
        port: gw-metrics
  - contains:
      path: spec.podSelector.matchExpressions
      content:
        key: app
        operator: NotIn
        values: [k8s-credential-provider]
  - notContains:
      path: spec.ingress[0].ports
      content:
        protocol: TCP
        port: statusz
- it: allows the named bucket initialization job to reach RustFS
  template: rustfs.yaml
  documentSelector:
    path: kind
    value: NetworkPolicy
  asserts:
  - equal:
      path: metadata.namespace
      value: custom-system
  - contains:
      path: spec.ingress[0].from
      content:
        podSelector:
          matchLabels:
            batch.kubernetes.io/job-name: custom-rustfs-bucket-init
  - equal:
      path: spec.ingress[0].ports
      value:
      - protocol: TCP
        port: api
- it: removes the bucket initialization job after it succeeds
  template: rustfs.yaml
  documentSelector:
    path: kind
    value: Job
  asserts:
  - equal:
      path: metadata.annotations["helm.sh/hook"]
      value: post-install,post-upgrade
  - equal:
      path: metadata.annotations["helm.sh/hook-delete-policy"]
      value: before-hook-creation,hook-succeeded
