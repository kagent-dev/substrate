suite: Control plane integration
templates:
- ate-api-server.yaml
- ate-api-config.yaml
- ate-controller.yaml
- atenet-router.yaml
- role.yaml
- atelet.yaml
- k8s-credential-provider.yaml
- ate-system-networkpolicies.yaml
- rustfs.yaml
release:
  name: custom
  namespace: custom-system
tests:
- it: probes the API health listener and resolves component identities
  template: ate-api-server.yaml
  documentSelector:
    path: kind
    value: Deployment
  asserts:
  - contains:
      path: spec.template.spec.containers[0].ports
      content:
        name: health
        containerPort: 9091
  - equal:
      path: spec.template.spec.containers[0].readinessProbe.httpGet.port
      value: health
  - equal:
      path: spec.template.spec.containers[0].startupProbe.httpGet.port
      value: health
  - equal:
      path: spec.template.spec.containers[0].livenessProbe.httpGet.port
      value: health
  - contains:
      path: spec.template.spec.containers[0].args
      content: --controller-spiffe-id=spiffe://cluster.local/ns/custom-system/sa/custom-ate-controller
  - contains:
      path: spec.template.spec.containers[0].args
      content: --egress-gateway-spiffe-id=spiffe://cluster.local/ns/custom-system/sa/custom-atenet-egress
  - contains:
      path: spec.template.spec.containers[0].args
      content: --ingress-router-spiffe-id=spiffe://cluster.local/ns/custom-system/sa/custom-atenet-router
- it: lets atelet watch the configs and pools of its workers
  template: atelet.yaml
  documentSelector:
    path: kind
    value: ClusterRole
  asserts:
  - contains:
      path: rules
      content:
        apiGroups: [ate.dev]
        resources: [sandboxconfigs, workerpools]
        verbs: [get, list, watch]
  - contains:
      path: rules
      content:
        apiGroups: [events.k8s.io]
        resources: [events]
        verbs: [create, patch]
- it: probes atelet health without exposing host ports
  template: atelet.yaml
  documentSelector:
    path: kind
    value: DaemonSet
  asserts:
  - contains:
      path: spec.template.spec.containers[0].ports
      content:
        name: grpc
        containerPort: 21998
  - contains:
      path: spec.template.spec.containers[0].ports
      content:
        name: prometheus
        containerPort: 9090
        protocol: TCP
  - contains:
      path: spec.template.spec.containers[0].ports
      content:
        name: health
        containerPort: 9091
        protocol: TCP
  - equal:
      path: spec.template.spec.containers[0].readinessProbe.httpGet.port
      value: health
  - equal:
      path: spec.template.spec.containers[0].livenessProbe.httpGet.port
      value: health
  - notExists:
      path: spec.template.spec.containers[0].ports[0].hostPort
  - contains:
      path: spec.template.spec.containers[0].args
      content: --herder-allowed-spiffe-id=spiffe://cluster.local/ns/custom-system/sa/custom-ate-api-server
  - contains:
      path: spec.template.spec.tolerations
      content:
        key: cloud.google.com/compute-class
        operator: Exists
        effect: NoSchedule
- it: schedules atelet on every node by default
  template: atelet.yaml
  documentSelector:
    path: kind
    value: DaemonSet
  asserts:
  - notExists:
      path: spec.template.spec.nodeSelector
- it: restricts atelet to nodes matching atelet.nodeSelector
  template: atelet.yaml
  documentSelector:
    path: kind
    value: DaemonSet
  set:
    atelet:
      nodeSelector:
        pool: agents
  asserts:
  - equal:
      path: spec.template.spec.nodeSelector
      value:
        pool: agents
- it: probes the credential provider on its health listener
  template: k8s-credential-provider.yaml
  documentSelector:
    path: kind
    value: Deployment
  asserts:
  - contains:
      path: spec.template.spec.containers[0].ports
      content:
        name: health
        containerPort: 9091
  - equal:
      path: spec.template.spec.containers[0].readinessProbe.httpGet.port
      value: health
  - contains:
      path: spec.template.spec.containers[0].args
      content: --status-address=127.0.0.1:4040
  - notContains:
      path: spec.template.spec.containers[0].ports
      content:
        name: statusz
        containerPort: 4040
- it: denies ingress by default in the release namespace
  template: ate-system-networkpolicies.yaml
  documentSelector:
    path: metadata.name
    value: custom-default-deny-ingress
  asserts:
  - equal:
      path: metadata.namespace
      value: custom-system
  - equal:
      path: spec.podSelector
      value: {}
  - equal:
      path: spec.policyTypes
      value: [Ingress]
  - notExists:
      path: spec.ingress
- it: permits agentgateway metrics but keeps credential provider status private
  template: ate-system-networkpolicies.yaml
  documentSelector:
    path: metadata.name
    value: custom-ate-system-observability
  asserts:
  - contains:
      path: spec.ingress[0].ports
      content:
        protocol: TCP
        port: gw-metrics
  - contains:
      path: spec.podSelector.matchExpressions
      content:
        key: app
        operator: NotIn
        values: [k8s-credential-provider]
  - notContains:
      path: spec.ingress[0].ports
      content:
        protocol: TCP
        port: statusz
- it: allows the named bucket initialization job to reach RustFS
  template: rustfs.yaml
  documentSelector:
    path: kind
    value: NetworkPolicy
  asserts:
  - equal:
      path: metadata.namespace
      value: custom-system
  - contains:
      path: spec.ingress[0].from
      content:
        podSelector:
          matchLabels:
            batch.kubernetes.io/job-name: custom-rustfs-bucket-init
  - equal:
      path: spec.ingress[0].ports
      value:
      - protocol: TCP
        port: api

- it: supplies the required API config and bootstraps the release client
  template: ate-api-server.yaml
  documentSelector:
    path: kind
    value: Deployment
  asserts:
  - contains:
      path: spec.template.spec.containers[0].args
      content: --config-file=/run/apiconfig.ate.dev/apiconfig.textproto
  - contains:
      path: spec.template.spec.containers[0].args
      content: --authz-bootstrap-owners=system:serviceaccount:custom-system:custom-ate-client
  - contains:
      path: spec.template.spec.containers[0].volumeMounts
      content:
        name: api-config
        mountPath: /run/apiconfig.ate.dev
        readOnly: true
  - contains:
      path: spec.template.spec.volumes
      content:
        name: api-config
        configMap:
          name: custom-ate-api-config
- it: configures operator ownership
  template: ate-api-server.yaml
  set:
    ateApi.authorization.bootstrapOwners:
    - system:serviceaccount:operators:admin
  documentSelector:
    path: kind
    value: Deployment
  asserts:
  - contains:
      path: spec.template.spec.containers[0].args
      content: --authz-bootstrap-owners=system:serviceaccount:operators:admin
- it: configures API logging in textproto
  template: ate-api-config.yaml
  set:
    ateApi.logLevel: debug
  asserts:
  - equal:
      path: metadata.name
      value: custom-ate-api-config
  - equal:
      path: data["apiconfig.textproto"]
      value: |
        logging: { level: "debug" }
- it: rejects an invalid API log level
  template: ate-api-config.yaml
  set:
    ateApi.logLevel: verbose
  asserts:
  - failedTemplate:
      errorMessage: ateApi.logLevel must be debug, info, warn, or error
- it: lets the controller provision worker service accounts
  template: role.yaml
  documentSelector:
    path: kind
    value: ClusterRole
  asserts:
  - contains:
      path: rules
      content:
        apiGroups: [""]
        resources: [serviceaccounts]
        verbs: [create, patch]

- it: retains the controller sandbox configuration permissions
  template: role.yaml
  documentSelector:
    path: kind
    value: ClusterRole
  asserts:
  - contains:
      path: rules
      content:
        apiGroups: [ate.dev]
        resources: [sandboxconfigs]
        verbs: [get, list, patch, watch]
  - notContains:
      path: rules
      content:
        apiGroups: [""]
        resources: [secrets]
        verbs: [get, list, watch]
- it: limits controller secret reads to the MITM CA pool in the release namespace
  template: role.yaml
  documentSelector:
    path: kind
    value: Role
  asserts:
  - equal:
      path: metadata.namespace
      value: custom-system
  - contains:
      path: rules
      content:
        apiGroups: [""]
        resourceNames: [egress-mitm-ca-pool]
        resources: [secrets]
        verbs: [get, list, watch]
- it: grants the controller its namespaced permissions
  template: ate-controller.yaml
  documentSelector:
    path: kind
    value: RoleBinding
  asserts:
  - equal:
      path: metadata.namespace
      value: custom-system
  - equal:
      path: roleRef
      value:
        apiGroup: rbac.authorization.k8s.io
        kind: Role
        name: custom-ate-controller
  - equal:
      path: subjects
      value:
      - kind: ServiceAccount
        name: custom-ate-controller
        namespace: custom-system
- it: limits API configuration reads to pools and CSI drivers
  template: ate-api-server.yaml
  documentSelector:
    path: kind
    value: ClusterRole
  asserts:
  - equal:
      path: rules[2]
      value:
        apiGroups: [ate.dev]
        resources: [workerpools, csidriverconfigs]
        verbs: [get, watch, list]

- it: requires a trusted and explicitly allowed router client
  template: atenet-router.yaml
  documentSelector:
    path: kind
    value: ConfigMap
  asserts:
  - matchRegex:
      path: data["config.yaml"]
      pattern: 'source.spiffeId in \[\]'
  - matchRegex:
      path: data["config.yaml"]
      pattern: 'root: /run/podidentity.podcert.ate.dev/trust-bundle.pem'
  - notMatchRegex:
      path: data["config.yaml"]
      pattern: 'port: 808[01]'
- it: allows the configured router client identities
  template: atenet-router.yaml
  set:
    atenetRouter.ingressAllowedSPIFFEIDs:
    - spiffe://cluster.local/ns/client/sa/router-client
  documentSelector:
    path: kind
    value: ConfigMap
  asserts:
  - matchRegex:
      path: data["config.yaml"]
      pattern: 'source.spiffeId in \["spiffe://cluster.local/ns/client/sa/router-client"\]'
