suite: atenet egress credential providers
templates:
- atenet-egress.yaml
tests:
- it: resolves only the bundled k8s.io provider by default
  documentSelector:
    path: kind
    value: ConfigMap
  asserts:
  - matchRegex:
      path: data["config.yaml"]
      pattern: '(?s)credentialProviders:\n\s+- uriAuthority: k8s\.io\n\s+target:\n\s+host: RELEASE-NAME-k8s-credential-provider\.NAMESPACE\.svc:50051'
  - notMatchRegex:
      path: data["config.yaml"]
      pattern: '(?s)(?:uriAuthority:.*){3}'

- it: adds a provider to both the HTTPS and the HTTP egress listener
  set:
    credentialProvider.additionalProviders:
    - uriAuthority: kagent.dev
      host: kagent-credentials.kagent.svc:50051
  documentSelector:
    path: kind
    value: ConfigMap
  asserts:
  - matchRegex:
      path: data["config.yaml"]
      pattern: '(?s)protocol: HTTPS.*- uriAuthority: kagent\.dev\n\s+target:\n\s+host: kagent-credentials\.kagent\.svc:50051\n\s+policies:\n\s+backendTLS:\n\s+cert: /run/podidentity\.podcert\.ate\.dev/credential-bundle\.pem\n\s+key: /run/podidentity\.podcert\.ate\.dev/credential-bundle\.pem\n\s+root: /run/servicedns\.podcert\.ate\.dev/trust-bundle\.pem.*protocol: HTTP\n.*- uriAuthority: kagent\.dev'

- it: refuses an entry without a host
  set:
    credentialProvider.additionalProviders:
    - uriAuthority: kagent.dev
  asserts:
  - failedTemplate:
      errorMessage: credentialProvider.additionalProviders entries need uriAuthority and host

- it: refuses to replace the bundled provider
  set:
    credentialProvider.additionalProviders:
    - uriAuthority: k8s.io
      host: other.example.svc:50051
  asserts:
  - failedTemplate:
      errorMessage: credentialProvider.additionalProviders cannot replace the bundled k8s.io provider

- it: refuses the same authority twice
  set:
    credentialProvider.additionalProviders:
    - uriAuthority: kagent.dev
      host: a.kagent.svc:50051
    - uriAuthority: kagent.dev
      host: b.kagent.svc:50051
  asserts:
  - failedTemplate:
      errorMessage: credentialProvider.additionalProviders names kagent.dev twice

- it: refuses an entry without a uriAuthority
  set:
    credentialProvider.additionalProviders:
    - host: kagent-credentials.kagent.svc:50051
  asserts:
  - failedTemplate:
      errorMessage: credentialProvider.additionalProviders entries need uriAuthority and host

- it: refuses a uriAuthority that is not a lowercase DNS name
  set:
    credentialProvider.additionalProviders:
    - uriAuthority: "Kagent.dev\n  target: {}"
      host: kagent-credentials.kagent.svc:50051
  asserts:
  - failedTemplate:
      errorMessage: "credentialProvider.additionalProviders: uriAuthority \"Kagent.dev\\n  target: {}\" must be a lowercase DNS name"

- it: refuses a host the servicedns certificate cannot name
  set:
    credentialProvider.additionalProviders:
    - uriAuthority: kagent.dev
      host: kagent-credentials.kagent.svc.cluster.local:50051
  asserts:
  - failedTemplate:
      errorMessage: "credentialProvider.additionalProviders: host \"kagent-credentials.kagent.svc.cluster.local:50051\" must be <service>.<namespace>.svc:<port>"
