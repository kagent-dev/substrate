suite: ServiceAccount metadata
templates:
- ate-api-server.yaml
- ate-client.yaml
- ate-controller.yaml
- ate-idp-server.yaml
- atelet.yaml
- atenet-egress.yaml
- atenet-router.yaml
- k8s-credential-provider.yaml
- rustfs.yaml
release:
  name: custom
  namespace: custom-system
tests:
- it: adds configured labels and annotations to the ate-api-server ServiceAccount
  template: ate-api-server.yaml
  documentSelector:
    path: kind
    value: ServiceAccount
  set:
    ateApi.serviceAccount:
      labels:
        team: agents
      annotations:
        iam.gke.io/gcp-service-account: ate-api-server@example.iam.gserviceaccount.com
  asserts:
  - equal:
      path: metadata.name
      value: custom-ate-api-server
  - equal:
      path: metadata.labels
      value:
        team: agents
  - equal:
      path: metadata.annotations
      value:
        iam.gke.io/gcp-service-account: ate-api-server@example.iam.gserviceaccount.com
- it: adds configured labels and annotations to the ate-client ServiceAccount
  template: ate-client.yaml
  documentSelector:
    path: kind
    value: ServiceAccount
  set:
    ateClient.serviceAccount:
      labels:
        team: agents
      annotations:
        iam.gke.io/gcp-service-account: ate-client@example.iam.gserviceaccount.com
  asserts:
  - equal:
      path: metadata.name
      value: custom-ate-client
  - equal:
      path: metadata.labels
      value:
        apps: ate-client
        team: agents
  - equal:
      path: metadata.annotations
      value:
        iam.gke.io/gcp-service-account: ate-client@example.iam.gserviceaccount.com
