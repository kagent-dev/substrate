suite: PostgreSQL configuration
templates:
- ate-api-server-envvars.yaml
- ate-api-server.yaml
- postgres.yaml
tests:
- it: configures the bundled PostgreSQL database by default
  template: ate-api-server-envvars.yaml
  asserts:
  - isNotNull:
      path: data.ATE_API_POSTGRES_CONNECTION_STRING
  - equal:
      path: data.ATE_API_POSTGRES_SCHEMA
      value: public

- it: uses the static runtime source and no DDL override by default
  template: ate-api-server.yaml
  documentIndex: 3
  asserts:
  - contains:
      path: spec.template.spec.containers[0].args
      content: --postgres-connection-string=@env
  - notContains:
      path: spec.template.spec.containers[0].args
      content: --postgres-ddl-connection-string=@env
  - notContains:
      path: spec.template.spec.volumes
      content:
        name: postgres-runtime-connection
  - notContains:
      path: spec.template.spec.volumes
      content:
        name: postgres-ddl-connection

- it: configures an external PostgreSQL connection string and schema
  template: ate-api-server-envvars.yaml
  set:
    postgres:
      enabled: false
      connectionString: postgresql://user:pass@database:5432/agents
      schema: substrate
  asserts:
  - equal:
      path: data.ATE_API_POSTGRES_CONNECTION_STRING
      value: postgresql://user:pass@database:5432/agents
  - equal:
      path: data.ATE_API_POSTGRES_SCHEMA
      value: substrate

- it: configures separate runtime and DDL connection strings
  template: ate-api-server-envvars.yaml
  set:
    postgres:
      enabled: false
      connectionString: postgresql://runtime@database:5432/agents
      ddlConnectionString: postgresql://owner@database:5432/agents
  asserts:
  - equal:
      path: data.ATE_API_POSTGRES_CONNECTION_STRING
      value: postgresql://runtime@database:5432/agents
  - equal:
      path: data.ATE_API_POSTGRES_DDL_CONNECTION_STRING
      value: postgresql://owner@database:5432/agents

- it: configures stable PostgreSQL roles for rotating login users
  template: ate-api-server.yaml
  documentIndex: 3
  set:
    postgres:
      runtimeRole: substrate_runtime
      ddlRole: substrate_ddl
  asserts:
  - contains:
      path: spec.template.spec.containers[0].args
      content: --postgres-runtime-role=substrate_runtime
  - contains:
      path: spec.template.spec.containers[0].args
      content: --postgres-ddl-role=substrate_ddl

- it: omits bundled PostgreSQL for an external connection
  template: postgres.yaml
  set:
    postgres:
      enabled: false
      connectionString: postgresql://user:pass@database:5432/agents
  asserts:
  - hasDocuments:
      count: 0

- it: mounts an explicitly named runtime connection Secret
  template: ate-api-server.yaml
  documentIndex: 3
  set:
    postgres:
      enabled: false
      connectionStringSecretRef:
        name: shared-database
        key: url
  asserts:
  - contains:
      path: spec.template.spec.containers[0].args
      content: --postgres-connection-string=@file:/etc/ateapi/postgres/runtime/connection-string
  - notContains:
      path: spec.template.spec.containers[0].args
      content: --postgres-ddl-connection-string=@env
  - notContains:
      path: spec.template.spec.containers[0].env
      content:
        name: ATE_API_POSTGRES_CONNECTION_STRING
  - contains:
      path: spec.template.spec.containers[0].volumeMounts
      content:
        name: postgres-runtime-connection
        mountPath: /etc/ateapi/postgres/runtime
        readOnly: true
  - notExists:
      path: spec.template.spec.containers[0].volumeMounts[?(@.name == "postgres-runtime-connection")].subPath
  - contains:
      path: spec.template.spec.volumes
      content:
        name: postgres-runtime-connection
        projected:
          sources:
          - secret:
              name: shared-database
              items:
              - key: url
                path: connection-string

- it: mounts separate runtime and DDL keys from one Secret
  template: ate-api-server.yaml
  documentIndex: 3
  set:
    postgres:
      enabled: false
      connectionStringSecretRef:
        name: substrate-database
        key: runtimeUrl
      ddlConnectionStringSecretRef:
        name: substrate-database
        key: ddlUrl
  asserts:
  - contains:
      path: spec.template.spec.containers[0].args
      content: --postgres-connection-string=@file:/etc/ateapi/postgres/runtime/connection-string
  - contains:
      path: spec.template.spec.containers[0].args
      content: --postgres-ddl-connection-string=@file:/etc/ateapi/postgres/ddl/connection-string
  - notContains:
      path: spec.template.spec.containers[0].env
      content:
        name: ATE_API_POSTGRES_CONNECTION_STRING
  - notContains:
      path: spec.template.spec.containers[0].env
      content:
        name: ATE_API_POSTGRES_DDL_CONNECTION_STRING
  - contains:
      path: spec.template.spec.containers[0].volumeMounts
      content:
        name: postgres-runtime-connection
        mountPath: /etc/ateapi/postgres/runtime
        readOnly: true
  - contains:
      path: spec.template.spec.containers[0].volumeMounts
      content:
        name: postgres-ddl-connection
        mountPath: /etc/ateapi/postgres/ddl
        readOnly: true
  - notExists:
      path: spec.template.spec.containers[0].volumeMounts[?(@.name == "postgres-runtime-connection")].subPath
  - notExists:
      path: spec.template.spec.containers[0].volumeMounts[?(@.name == "postgres-ddl-connection")].subPath
  - contains:
      path: spec.template.spec.volumes
      content:
        name: postgres-runtime-connection
        projected:
          sources:
          - secret:
              name: substrate-database
              items:
              - key: runtimeUrl
                path: connection-string
  - contains:
      path: spec.template.spec.volumes
      content:
        name: postgres-ddl-connection
        projected:
          sources:
          - secret:
              name: substrate-database
              items:
              - key: ddlUrl
                path: connection-string

- it: mounts runtime and DDL connections from different Secrets
  template: ate-api-server.yaml
  documentIndex: 3
  set:
    postgres:
      enabled: false
      connectionStringSecretRef:
        name: runtime-database
        key: url
      ddlConnectionStringSecretRef:
        name: ddl-database
        key: url
  asserts:
  - equal:
      path: spec.template.spec.volumes[?(@.name == "postgres-runtime-connection")].projected.sources[0].secret.name
      value: runtime-database
  - equal:
      path: spec.template.spec.volumes[?(@.name == "postgres-ddl-connection")].projected.sources[0].secret.name
      value: ddl-database

- it: supports a runtime Secret with an inline DDL connection
  template: ate-api-server.yaml
  documentIndex: 3
  set:
    postgres:
      enabled: false
      connectionStringSecretRef:
        name: runtime-database
      ddlConnectionString: postgresql://owner@database:5432/agents
  asserts:
  - contains:
      path: spec.template.spec.containers[0].args
      content: --postgres-connection-string=@file:/etc/ateapi/postgres/runtime/connection-string
  - contains:
      path: spec.template.spec.containers[0].args
      content: --postgres-ddl-connection-string=@env

- it: keeps only inline DDL credentials in the ConfigMap for mixed mode
  template: ate-api-server-envvars.yaml
  set:
    postgres:
      enabled: false
      connectionStringSecretRef:
        name: runtime-database
      ddlConnectionString: postgresql://owner@database:5432/agents
  asserts:
  - notExists:
      path: data.ATE_API_POSTGRES_CONNECTION_STRING
  - equal:
      path: data.ATE_API_POSTGRES_DDL_CONNECTION_STRING
      value: postgresql://owner@database:5432/agents

- it: supports an inline runtime connection with a DDL Secret
  template: ate-api-server.yaml
  documentIndex: 3
  set:
    postgres:
      enabled: false
      connectionString: postgresql://runtime@database:5432/agents
      ddlConnectionStringSecretRef:
        name: ddl-database
  asserts:
  - contains:
      path: spec.template.spec.containers[0].args
      content: --postgres-connection-string=@env
  - contains:
      path: spec.template.spec.containers[0].args
      content: --postgres-ddl-connection-string=@file:/etc/ateapi/postgres/ddl/connection-string
  - contains:
      path: spec.template.spec.containers[0].volumeMounts
      content:
        name: postgres-ddl-connection
        mountPath: /etc/ateapi/postgres/ddl
        readOnly: true
  - notExists:
      path: spec.template.spec.containers[0].volumeMounts[?(@.name == "postgres-ddl-connection")].subPath

- it: keeps only inline runtime credentials in the ConfigMap for mixed mode
  template: ate-api-server-envvars.yaml
  set:
    postgres:
      enabled: false
      connectionString: postgresql://runtime@database:5432/agents
      ddlConnectionStringSecretRef:
        name: ddl-database
  asserts:
  - equal:
      path: data.ATE_API_POSTGRES_CONNECTION_STRING
      value: postgresql://runtime@database:5432/agents
  - notExists:
      path: data.ATE_API_POSTGRES_DDL_CONNECTION_STRING

- it: derives a release-scoped Secret name when enabled
  template: ate-api-server.yaml
  documentIndex: 3
  set:
    postgres:
      enabled: false
      connectionStringSecretRef:
        enabled: true
  asserts:
  - contains:
      path: spec.template.spec.volumes
      content:
        name: postgres-runtime-connection
        projected:
          sources:
          - secret:
              name: RELEASE-NAME-postgres-connection
              items:
              - key: connectionString
                path: connection-string

- it: keeps credentials out of the ConfigMap in Secret mode
  template: ate-api-server-envvars.yaml
  set:
    postgres:
      enabled: false
      schema: substrate
      connectionStringSecretRef:
        name: shared-database
  asserts:
  - notExists:
      path: data.ATE_API_POSTGRES_CONNECTION_STRING
  - equal:
      path: data.ATE_API_POSTGRES_SCHEMA
      value: substrate

- it: configures the maximum connection lifetime
  template: ate-api-server.yaml
  documentIndex: 3
  set:
    postgres:
      pool:
        maxConnLifetime: 10m
  asserts:
  - contains:
      path: spec.template.spec.containers[0].args
      content: --postgres-max-conn-lifetime=10m

- it: rejects disabling bundled PostgreSQL without a connection
  template: ate-api-server-envvars.yaml
  set:
    postgres:
      enabled: false
  asserts:
  - failedTemplate:
      errorMessage: postgres.connectionString or postgres.connectionStringSecretRef is required when postgres.enabled=false

- it: rejects configuring both a literal connection and a Secret
  template: ate-api-server-envvars.yaml
  set:
    postgres:
      connectionString: postgresql://user:pass@database:5432/agents
      connectionStringSecretRef:
        name: shared-database
  asserts:
  - failedTemplate:
      errorMessage: postgres.connectionString and postgres.connectionStringSecretRef are mutually exclusive

- it: rejects a DDL connection without an explicit runtime connection
  template: ate-api-server-envvars.yaml
  set:
    postgres:
      ddlConnectionString: postgresql://owner@database:5432/agents
  asserts:
  - failedTemplate:
      errorMessage: postgres.connectionString or postgres.connectionStringSecretRef is required when a DDL connection is configured

- it: rejects both a literal and Secret-backed DDL connection
  template: ate-api-server-envvars.yaml
  set:
    postgres:
      connectionString: postgresql://runtime@database:5432/agents
      ddlConnectionString: postgresql://owner@database:5432/agents
      ddlConnectionStringSecretRef:
        name: substrate-database
  asserts:
  - failedTemplate:
      errorMessage: postgres.ddlConnectionString and postgres.ddlConnectionStringSecretRef are mutually exclusive
