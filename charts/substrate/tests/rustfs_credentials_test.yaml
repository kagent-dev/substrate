suite: RustFS credentials
templates:
- rustfs.yaml
- ate-api-server-envvars.yaml
- ate-api-server.yaml
tests:
- it: renders the inline credentials by default
  template: rustfs.yaml
  documentSelector:
    path: kind
    value: Deployment
  asserts:
  - contains:
      path: spec.template.spec.containers[0].env
      content:
        name: RUSTFS_ACCESS_KEY
        value: rustfsadmin
  - contains:
      path: spec.template.spec.containers[0].env
      content:
        name: RUSTFS_SECRET_KEY
        value: rustfsadmin

- it: renders the inline object-store plugin credentials by default
  template: ate-api-server.yaml
  documentSelector:
    path: kind
    value: Deployment
  asserts:
  - contains:
      path: spec.template.spec.initContainers[?(@.name == "objectstore-plugin")].env
      content:
        name: AWS_SECRET_ACCESS_KEY
        value: rustfsadmin

- it: reads the RustFS server credentials from rustfs.existingSecret
  template: rustfs.yaml
  documentSelector:
    path: kind
    value: Deployment
  set:
    rustfs.existingSecret: rustfs-credentials
  asserts:
  - contains:
      path: spec.template.spec.containers[0].env
      content:
        name: RUSTFS_ACCESS_KEY
        valueFrom:
          secretKeyRef:
            name: rustfs-credentials
            key: AWS_ACCESS_KEY_ID
  - contains:
      path: spec.template.spec.containers[0].env
      content:
        name: RUSTFS_SECRET_KEY
        valueFrom:
          secretKeyRef:
            name: rustfs-credentials
            key: AWS_SECRET_ACCESS_KEY

- it: reads the bucket-init credentials from rustfs.existingSecret
  template: rustfs.yaml
  documentSelector:
    path: kind
    value: Job
  set:
    rustfs.existingSecret: rustfs-credentials
  asserts:
  - contains:
      path: spec.template.spec.containers[0].env
      content:
        name: AWS_ACCESS_KEY_ID
        valueFrom:
          secretKeyRef:
            name: rustfs-credentials
            key: AWS_ACCESS_KEY_ID
  - contains:
      path: spec.template.spec.containers[0].env
      content:
        name: AWS_SECRET_ACCESS_KEY
        valueFrom:
          secretKeyRef:
            name: rustfs-credentials
            key: AWS_SECRET_ACCESS_KEY

- it: reads the object-store plugin credentials from rustfs.existingSecret
  template: ate-api-server.yaml
  documentSelector:
    path: kind
    value: Deployment
  set:
    rustfs.existingSecret: rustfs-credentials
  asserts:
  - contains:
      path: spec.template.spec.initContainers[?(@.name == "objectstore-plugin")].env
      content:
        name: AWS_ACCESS_KEY_ID
        valueFrom:
          secretKeyRef:
            name: rustfs-credentials
            key: AWS_ACCESS_KEY_ID
  - contains:
      path: spec.template.spec.initContainers[?(@.name == "objectstore-plugin")].env
      content:
        name: AWS_SECRET_ACCESS_KEY
        valueFrom:
          secretKeyRef:
            name: rustfs-credentials
            key: AWS_SECRET_ACCESS_KEY
