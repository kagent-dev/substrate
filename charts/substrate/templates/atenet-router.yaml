apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "substrate.fullname" (list "atenet-router" .) }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: atenet-router
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "substrate.fullname" (list "atenet-router" .) }}
rules:
- apiGroups:
  - "ate.dev"
  resources:
  - actortemplates
  verbs:
  - get
  - watch
  - list
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "substrate.fullname" (list "atenet-router" .) }}
subjects:
- kind: ServiceAccount
  name: {{ include "substrate.fullname" (list "atenet-router" .) }}
  namespace: {{ .Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: {{ include "substrate.fullname" (list "atenet-router" .) }}
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "substrate.fullname" (list "atenet-router-envoy-config" .) }}
  namespace: {{ .Release.Namespace }}
data:
  envoy.yaml: |
    admin:
      address:
        socket_address:
          address: 0.0.0.0
          port_value: 9901

    node:
      id: substrate-envoy-node
      cluster: substrate-router-cluster

    dynamic_resources:
      lds_config:
        resource_api_version: V3
        ads: {}
      cds_config:
        resource_api_version: V3
        ads: {}
      ads_config:
        api_type: GRPC
        transport_api_version: V3
        grpc_services:
        - envoy_grpc:
            cluster_name: xds_cluster

    static_resources:
      clusters:
      - name: xds_cluster
        connect_timeout: 0.25s
        type: STRICT_DNS
        lb_policy: ROUND_ROBIN
        typed_extension_protocol_options:
          envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
            "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
            explicit_http_config:
              http2_protocol_options: {}
        load_assignment:
          cluster_name: xds_cluster
          endpoints:
          - lb_endpoints:
            - endpoint:
                address:
                  socket_address:
                    address: 127.0.0.1
                    port_value: 18000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "substrate.fullname" (list "atenet-router" .) }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: atenet-router
spec:
  replicas: 1
  selector:
    matchLabels:
      app: atenet-router
  template:
    metadata:
      labels:
        app: atenet-router
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
    spec:
      serviceAccountName: {{ include "substrate.fullname" (list "atenet-router" .) }}
{{- if eq .Values.auth.mode "jwt" }}
      initContainers:
      - name: assemble-envoy-cred-bundle
        image: {{ .Values.images.busybox }}
        command:
        - sh
        - -c
        - cat /run/ateapi-tls-src/tls.crt /run/ateapi-tls-src/tls.key > /run/envoy-tls/credential-bundle.pem
        volumeMounts:
        - name: ateapi-tls-src
          mountPath: /run/ateapi-tls-src
          readOnly: true
        - name: envoy-tls
          mountPath: /run/envoy-tls
{{- end }}
      containers:
      - name: atenet-router
        image: {{ include "substrate.componentImage" (list "atenet" .) }}
        args:
        - "router"
        - "--standalone"
        - "--namespace={{ .Release.Namespace }}"
        - "--port-http=8080"
        - "--port-xds=18000"
        - "--port-extproc=50051"
        - "--extproc-address=127.0.0.1"
        - "--ateapi-address={{ include "substrate.fullname" (list "api" .) }}.{{ .Release.Namespace }}.svc:443"
{{- if eq .Values.auth.mode "jwt" }}
        - "--ateapi-auth=jwt"
        - "--ateapi-ca-file=/run/ateapi-ca/ca.crt"
        - "--ateapi-server-name={{ include "substrate.fullname" (list "api" .) }}.{{ .Release.Namespace }}.svc"
        - "--ateapi-token-file=/var/run/secrets/tokens/ateapi/token"
{{- end }}
        - "--status-port=4040"
        - "--port-https=8443"
{{- if eq .Values.auth.mode "mtls" }}
        - "--envoy-cert-path=/run/servicedns.podcert.ate.dev/credential-bundle.pem"
{{- else }}
        - "--envoy-cert-path=/run/envoy-tls/credential-bundle.pem"
{{- end }}
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: POD_UID
          valueFrom:
            fieldRef:
              fieldPath: metadata.uid
        - name: OTEL_RESOURCE_ATTRIBUTES
          value: k8s.namespace.name=$(POD_NAMESPACE),k8s.pod.name=$(POD_NAME),k8s.pod.uid=$(POD_UID),service.instance.id=$(POD_UID)
{{- if .Values.otel.endpoint }}
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: {{ .Values.otel.endpoint | quote }}
{{- end }}
        ports:
        - name: xds
          containerPort: 18000
        - name: extproc
          containerPort: 50051
        - name: status
          containerPort: 4040
        - name: metrics
          containerPort: 9090
{{- if eq .Values.auth.mode "jwt" }}
        volumeMounts:
        - name: ateapi-ca
          mountPath: /run/ateapi-ca
          readOnly: true
        - name: ateapi-token
          mountPath: /var/run/secrets/tokens/ateapi
          readOnly: true
{{- end }}
      - name: envoy
        image: {{ .Values.images.envoy }}
        command:
        - "/usr/local/bin/envoy"
        - "-c"
        - "/etc/envoy/envoy.yaml"
        - "--component-log-level"
        - "upstream:debug,router:debug,ext_proc:debug"
        ports:
        - name: http
          containerPort: 8080
        - name: https
          containerPort: 8443
        - name: admin
          containerPort: 9901
        volumeMounts:
        - name: envoy-config
          mountPath: /etc/envoy
{{- if eq .Values.auth.mode "mtls" }}
        - name: "servicedns"
          mountPath: "/run/servicedns.podcert.ate.dev"
{{- else }}
        - name: envoy-tls
          mountPath: /run/envoy-tls
          readOnly: true
{{- end }}
      volumes:
      - name: envoy-config
        configMap:
          name: {{ include "substrate.fullname" (list "atenet-router-envoy-config" .) }}
{{- if eq .Values.auth.mode "mtls" }}
      - name: "servicedns"
        projected:
          sources:
          - podCertificate:
              signerName: servicedns.podcert.ate.dev/identity
              keyType: ECDSAP256
              credentialBundlePath: credential-bundle.pem
{{- else }}
      - name: ateapi-tls-src
        secret:
          secretName: {{ .Values.auth.jwt.serverCertSecret }}
      - name: envoy-tls
        emptyDir: {}
      - name: ateapi-ca
        configMap:
          name: {{ .Values.auth.jwt.caBundleConfigMap }}
      - name: ateapi-token
        projected:
          sources:
          - serviceAccountToken:
              audience: {{ .Values.auth.jwt.audience }}
              expirationSeconds: 3600
              path: token
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "substrate.fullname" (list "atenet-router" .) }}
  namespace: {{ .Release.Namespace }}
spec:
  type: ClusterIP
  selector:
    app: atenet-router
  ports:
  - name: http
    port: 80
    targetPort: 8080
    protocol: TCP
  - name: https
    port: 443
    targetPort: 8443
    protocol: TCP
