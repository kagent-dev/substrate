{{- if .Values.postgres.enabled }}
{{- $host := printf "%s.%s.svc" (include "substrate.fullname" (list "postgres" .)) .Release.Namespace -}}
{{- /* The default service-DNS CA signs with Ed25519, which pgx cannot hash for SCRAM channel binding. TLS verification and client certificates remain required. */ -}}
{{- $tls := "sslmode=verify-full&sslrootcert=/run/servicedns.podcert.ate.dev/trust-bundle.pem&sslcert=/run/podidentity.podcert.ate.dev/credential-bundle.pem&sslkey=/run/podidentity.podcert.ate.dev/credential-bundle.pem&channel_binding=disable" -}}
{{- if not .Values.postgres.adminSecretRef.name }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "substrate.postgres.adminSecretName" . }}
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: postgres
---
{{- end }}
{{- if not .Values.postgres.readWriteConnectionStringSecretRef.name }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "substrate.postgres.readWriteSecretName" . }}
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  readWriteConnectionString: {{ include "substrate.postgres.readWriteConnectionString" (dict "host" $host "database" .Values.postgres.database "params" $tls) | quote }}
---
{{- end }}
{{- if not .Values.postgres.ownerConnectionStringSecretRef.name }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "substrate.postgres.ownerSecretName" . }}
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  ownerConnectionString: {{ include "substrate.postgres.ownerConnectionString" (dict "host" $host "database" .Values.postgres.database "params" $tls) | quote }}
{{- end }}
{{- end }}
