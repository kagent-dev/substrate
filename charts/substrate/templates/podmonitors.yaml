{{- /* atelet's PodMonitor is in atelet.yaml, so substrate-atelet renders it too. */}}
{{- if .Values.podMonitors.enabled }}
{{- $targets := list (list "ate-api-server" "prometheus") (list "atenet-router" "gw-metrics") (list "atenet-egress" "stats") }}
{{- /* ate-controller closes its metrics port when OTEL_METRICS_EXPORTER is none. */}}
{{- if .Values.otel.metrics.enabled }}
{{- $targets = append $targets (list "ate-controller" "metrics") }}
{{- end }}
{{- range $targets }}
---
apiVersion: {{ $.Values.podMonitors.apiVersion }}
kind: PodMonitor
metadata:
  name: {{ include "substrate.fullname" (list (index . 0) $) }}
  namespace: {{ $.Release.Namespace }}
spec:
  selector:
    matchLabels:
      app: {{ index . 0 }}
  podMetricsEndpoints:
  - port: {{ index . 1 }}
    path: /metrics
{{- end }}
{{- end }}
