apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "substrate.fullname" (list "atenet-egress" .) }}
  namespace: {{ .Release.Namespace }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "substrate.fullname" (list "atenet-egress-agentgateway-config" .) }}
  namespace: {{ .Release.Namespace }}
data:
  config.yaml: |
    # yaml-language-server: $schema=https://agentgateway.dev/schema/config
    frontendPolicies:
      connect:
        mode: tunnel
      accessLog:
        add:
          substrate.connect.authority: source.connectHeaders["host"]
      # Authorize the actor identity at CONNECT-accept, before any tunnel
      # (HTTP, TLS, or opaque TCP) is terminated. Fails closed when the
      # control plane is unreachable.
      substrateEgressActorResolution:
        host: {{ include "substrate.fullname" (list "api" .) }}.{{ .Release.Namespace }}.svc:443
        policies:
          backendTLS:
            cert: /run/podidentity.podcert.ate.dev/credential-bundle.pem
            key: /run/podidentity.podcert.ate.dev/credential-bundle.pem
            root: /run/servicedns.podcert.ate.dev/trust-bundle.pem

    # Bind the CONNECT front door to the pod IP so tunnel re-entry selects
    # the wildcard internal listener instead of this gateway again.
    gateways:
      egress:
        port: 8443
        bindAddress: $POD_IP
        protocol: HTTPS
        tls:
          cert: /run/servicedns.podcert.ate.dev/credential-bundle.pem
          key: /run/servicedns.podcert.ate.dev/credential-bundle.pem
          root: /run/actor-id-ca-certs/ca.crt

    binds:
    - mode: internal
      protocol: AUTO
      listeners:
      - protocol: HTTPS
        tls:
          mode: dynamicCa
          cert: /run/egress-mitm/tls.crt
          key: /run/egress-mitm/tls.key
        routes:
        - name: reject-websocket-upgrade
          matches:
          - headers:
            - name: Connection
              value:
                regex: '(?i)(^|,)\s*upgrade\s*(,|$)'
            - name: Upgrade
              value:
                regex: '(?i)(^|,)\s*websocket\s*(,|$)'
          policies:
            directResponse:
              status: 403
              body: WebSocket egress is not supported
        - backends:
          - dynamic: {}
            policies:
              backendTLS:
                root: /etc/ssl/certs/ca-certificates.crt
          policies:
            substrateEgress:
              host: {{ include "substrate.fullname" (list "api" .) }}.{{ .Release.Namespace }}.svc:443
              policies:
                backendTLS:
                  cert: /run/podidentity.podcert.ate.dev/credential-bundle.pem
                  key: /run/podidentity.podcert.ate.dev/credential-bundle.pem
                  root: /run/servicedns.podcert.ate.dev/trust-bundle.pem
              credentialProviders:
              - uriAuthority: k8s.io
                target:
                  host: {{ include "substrate.fullname" (list "k8s-credential-provider" .) }}.{{ .Release.Namespace }}.svc:50051
                  policies:
                    backendTLS:
                      cert: /run/podidentity.podcert.ate.dev/credential-bundle.pem
                      key: /run/podidentity.podcert.ate.dev/credential-bundle.pem
                      root: /run/servicedns.podcert.ate.dev/trust-bundle.pem
      - protocol: HTTP
        routes:
        - name: reject-websocket-upgrade
          matches:
          - headers:
            - name: Connection
              value:
                regex: '(?i)(^|,)\s*upgrade\s*(,|$)'
            - name: Upgrade
              value:
                regex: '(?i)(^|,)\s*websocket\s*(,|$)'
          policies:
            directResponse:
              status: 403
              body: WebSocket egress is not supported
        - backends:
          - dynamic:
              target: source.connectHeaders["host"]
          policies:
            substrateEgress:
              host: {{ include "substrate.fullname" (list "api" .) }}.{{ .Release.Namespace }}.svc:443
              policies:
                backendTLS:
                  cert: /run/podidentity.podcert.ate.dev/credential-bundle.pem
                  key: /run/podidentity.podcert.ate.dev/credential-bundle.pem
                  root: /run/servicedns.podcert.ate.dev/trust-bundle.pem
              credentialProviders:
              - uriAuthority: k8s.io
                target:
                  host: {{ include "substrate.fullname" (list "k8s-credential-provider" .) }}.{{ .Release.Namespace }}.svc:50051
                  policies:
                    backendTLS:
                      cert: /run/podidentity.podcert.ate.dev/credential-bundle.pem
                      key: /run/podidentity.podcert.ate.dev/credential-bundle.pem
                      root: /run/servicedns.podcert.ate.dev/trust-bundle.pem
      - protocol: TLS
        tcpRoutes:
        - backends:
          - dynamic: {}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "substrate.fullname" (list "atenet-egress" .) }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: atenet-egress
spec:
  replicas: 1
  selector:
    matchLabels:
      app: atenet-egress
  template:
    metadata:
      labels:
        app: atenet-egress
    spec:
      serviceAccountName: {{ include "substrate.fullname" (list "atenet-egress" .) }}
      securityContext:
        sysctls:
        - name: net.ipv4.ip_unprivileged_port_start
          value: "0"
      terminationGracePeriodSeconds: 60
      {{- with include "substrate.imagePullSecrets" . }}{{- . | nindent 6 }}{{- end }}
      containers:
      - name: agentgateway
        image: {{ include "substrate.thirdPartyImage" (list .Values.images.agentgateway .) }}
        resources:
{{ toYaml .Values.atenetEgress.agentgateway.resources | indent 10 }}
        args:
        - -f
        - /etc/agentgateway/config.yaml
        env:
        - name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        - name: RUST_LOG
          value: debug
        ports:
        - name: https
          containerPort: 8443
        - name: readiness
          containerPort: 15021
        - name: stats
          containerPort: 15020
        readinessProbe:
          httpGet:
            path: /healthz/ready
            port: readiness
          periodSeconds: 10
        startupProbe:
          failureThreshold: 60
          httpGet:
            path: /healthz/ready
            port: readiness
          periodSeconds: 1
        volumeMounts:
        - name: egress-mitm
          mountPath: /run/egress-mitm
          readOnly: true
        - name: config
          mountPath: /etc/agentgateway
          readOnly: true
        - name: servicedns
          mountPath: /run/servicedns.podcert.ate.dev
          readOnly: true
        - name: podidentity
          mountPath: /run/podidentity.podcert.ate.dev
          readOnly: true
        - name: actor-id-ca-certs
          mountPath: /run/actor-id-ca-certs
          readOnly: true
      volumes:
      - name: egress-mitm
        secret:
          secretName: egress-mitm-ca-pool
          items:
          - key: tls.crt
            path: tls.crt
          - key: tls.key
            path: tls.key
      - name: config
        configMap:
          name: {{ include "substrate.fullname" (list "atenet-egress-agentgateway-config" .) }}
      - name: servicedns
        projected:
          sources:
          - podCertificate:
              signerName: servicedns.podcert.ate.dev/identity
              keyType: ECDSAP256
              credentialBundlePath: credential-bundle.pem
          - clusterTrustBundle:
              signerName: servicedns.podcert.ate.dev/identity
              labelSelector:
                matchLabels:
                  podcert.ate.dev/canarying: live
              path: trust-bundle.pem
      - name: podidentity
        projected:
          sources:
          - podCertificate:
              signerName: podidentity.podcert.ate.dev/identity
              keyType: ECDSAP256
              credentialBundlePath: credential-bundle.pem
          - clusterTrustBundle:
              signerName: podidentity.podcert.ate.dev/identity
              labelSelector:
                matchLabels:
                  podcert.ate.dev/canarying: live
              path: trust-bundle.pem
      - name: actor-id-ca-certs
        secret:
          secretName: actor-id-ca-certs
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "substrate.fullname" (list "atenet-egress" .) }}
  namespace: {{ .Release.Namespace }}
spec:
  type: ClusterIP
  ipFamilyPolicy: PreferDualStack
  selector:
    app: atenet-egress
  ports:
  - name: https
    port: 443
    targetPort: https
    protocol: TCP
