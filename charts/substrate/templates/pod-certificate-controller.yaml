{{/*
These objects are cluster singletons: one podcertificate-controller serves every
signer in the cluster, and its namespace, Deployment, Role and RoleBinding are
named without the release prefix. A second release rendering them collides with
the first, which Helm reports as "already exists and is not owned by this
release". Turn this off on a cluster that already runs the controller -- from a
standalone substrate release, or as a parent chart installing substrate as a
subchart alongside one.
*/}}
{{- if .Values.podCertificateController.enabled }}
{{/*
The controller runs in the release namespace, with its own ServiceAccount, and
mounts service-dns-ca-pool and pod-identity-ca-pool from there. It used to run
in a fixed namespace of its own, on that namespace's default ServiceAccount --
which is why the SA is explicit here: the signer ClusterRole below is granted
to it, and in a shared namespace `default` is inherited by every pod that names
no ServiceAccount.
*/}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "substrate.fullname" (list "podcertificate-controller" .) }}
  namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "substrate.fullname" (list "podcert-ate-dev-signer" .) }}
rules:
# The service signer needs to be able to read services and pods.
- apiGroups:
  - ""
  resources:
  - services
  - pods
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - certificates.k8s.io
  resources:
  - podcertificaterequests
  verbs:
  - get
  - list
  - watch
  - update
- apiGroups:
  - certificates.k8s.io
  resources:
  - clustertrustbundles
  verbs:
  - create
  - get
  - list
  - watch
  - update
  - delete
- apiGroups:
  - certificates.k8s.io
  resources:
  - podcertificaterequests/status
  verbs:
  - update
- apiGroups:
  - certificates.k8s.io
  resources:
  - signers
  resourceNames:
  - servicedns.podcert.ate.dev/*
  - podidentity.podcert.ate.dev/*
  verbs:
  - sign
  - attest
- apiGroups:
  - events.k8s.io
  resources:
  - events
  verbs:
  - create
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "substrate.fullname" (list "podcert-ate-dev-signer" .) }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "substrate.fullname" (list "podcert-ate-dev-signer" .) }}
subjects:
- kind: ServiceAccount
  namespace: {{ .Release.Namespace }}
  name: {{ include "substrate.fullname" (list "podcertificate-controller" .) }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  namespace: {{ .Release.Namespace }}
  name: {{ include "substrate.fullname" (list "podcert-coordinator" .) }}
rules:
- apiGroups:
  - "coordination.k8s.io"
  resources:
  - "leases"
  verbs:
  - create
  - get
  - list
  - watch
  - update
  - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "substrate.fullname" (list "podcert-coordinator" .) }}
  namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "substrate.fullname" (list "podcert-coordinator" .) }}
subjects:
- kind: ServiceAccount
  namespace: {{ .Release.Namespace }}
  name: {{ include "substrate.fullname" (list "podcertificate-controller" .) }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "substrate.fullname" (list "podcertificate-controller" .) }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: podcertificate-controller
spec:
  replicas: 1
  selector:
    matchLabels:
      app: podcertificate-controller
  template:
    metadata:
      labels:
        app: podcertificate-controller
    spec:
      {{- with include "substrate.imagePullSecrets" . }}{{- . | nindent 6 }}{{- end }}
      containers:
      - name: controller
        image: {{ include "substrate.componentImage" (list "podcertcontroller" .) }}
        args:
        - --in-cluster=true
        - --sharding-pod-namespace=$(POD_NAMESPACE)
        - --sharding-pod-name=$(POD_NAME)
        - --sharding-pod-uid=$(POD_UID)
        - --sharding-application-name={{ include "substrate.fullname" (list "podcertificate-controller" .) }}
        - --service-dns-ca-pool=/run/ca-state/service-dns-pool.json
        - --pod-identity-ca-pool=/run/ca-state/pod-identity-pool.json
        env:
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_UID
          valueFrom:
            fieldRef:
              fieldPath: metadata.uid
        volumeMounts:
        - name: "ca-state"
          mountPath: "/run/ca-state"
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            add:
            - NET_BIND_SERVICE
            drop:
            - ALL
          readOnlyRootFilesystem: true
      volumes:
      - name: "ca-state"
        projected:
          sources:
          - secret:
              name: "service-dns-ca-pool"
              items:
              - key: "pool"
                path: "service-dns-pool.json"
          - secret:
              name: "pod-identity-ca-pool"
              items:
              - key: "pool"
                path: "pod-identity-pool.json"
      dnsPolicy: Default
      nodeSelector:
        kubernetes.io/os: linux
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      serviceAccountName: {{ include "substrate.fullname" (list "podcertificate-controller" .) }}
      terminationGracePeriodSeconds: 30
{{- end }}
