suite: Pod labels
templates:
- pod-certificate-controller.yaml
tests:
- it: keeps only the app label on the controller pod by default
  documentSelector:
    path: kind
    value: Deployment
  asserts:
  - equal:
      path: spec.template.metadata.labels
      value:
        app: podcertificate-controller

- it: adds podLabels to the controller pod next to the app label
  set:
    podLabels:
      giantswarm.io/tenant: team-a
  documentSelector:
    path: kind
    value: Deployment
  asserts:
  - equal:
      path: spec.template.metadata.labels
      value:
        app: podcertificate-controller
        giantswarm.io/tenant: team-a
  - equal:
      path: spec.selector.matchLabels
      value:
        app: podcertificate-controller

- it: refuses a podLabels entry that replaces the app selector label
  set:
    podLabels:
      app: other
  asserts:
  - failedTemplate:
      errorMessage: "podLabels must not set app: it is the selector label of the controller Deployment"
