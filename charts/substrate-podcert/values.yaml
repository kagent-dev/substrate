# Enable only when generating standalone manifests. Helm can create the namespace.
createNamespace: false
workersPerSigner: 1

# Requests and limits for the certificate controller container.
resources:
  requests:
    cpu: 10m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi

# Namespace containing the Substrate API server.
postgresClientNamespace: ate-system
# Service account used by the Substrate API server.
postgresClientServiceAccount: ate-api-server

# Additional service accounts allowed to request PostgreSQL login certificates.
# Each entry uses namespace/service-account=username[,username] form.
postgresClients: []

global:
  imageRegistry: ""
  imagePullSecrets: []

# Labels added to the controller pod, next to its own `app` label, which they
# cannot replace.
podLabels: {}

imagePullSecrets: []
image:
  registry: ghcr.io
  repository: kagent-dev/substrate
  tag: ""
