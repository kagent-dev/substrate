suite: Atelet ServiceAccount metadata
templates:
- atelet.yaml
release:
  name: node-agent
  namespace: ate-system
tests:
- it: leaves metadata unchanged by default
  documentSelector:
    path: kind
    value: ServiceAccount
  asserts:
  - notExists:
      path: metadata.annotations
  - notExists:
      path: metadata.labels
- it: adds configured metadata to the existing ServiceAccount
  set:
    substrateReleaseName: custom
    atelet.serviceAccount.labels:
      team: agents
    atelet.serviceAccount.annotations:
      example.com/workload-identity: enabled
  documentSelector:
    path: kind
    value: ServiceAccount
  asserts:
  - equal:
      path: metadata.name
      value: custom-atelet
  - equal:
      path: metadata.namespace
      value: ate-system
  - equal:
      path: metadata.labels.team
      value: agents
  - equal:
      path: metadata.annotations["example.com/workload-identity"]
      value: enabled
