suite: atelet PodMonitor
templates:
- podmonitor.yaml
tests:
- it: renders nothing by default
  asserts:
  - hasDocuments:
      count: 0

- it: selects the atelet pods on their prometheus port
  set:
    metrics.podMonitor.enabled: true
  release:
    namespace: ate-system
  asserts:
  - isKind:
      of: PodMonitor
  - equal:
      path: metadata.name
      value: atelet
  - equal:
      path: spec.selector.matchLabels.app
      value: atelet
  - equal:
      path: spec.namespaceSelector.matchNames[0]
      value: ate-system
  - equal:
      path: spec.podMetricsEndpoints[0].port
      value: prometheus
  - notExists:
      path: spec.podMetricsEndpoints[0].interval

# The name follows substrateReleaseName, like every other atelet object, so it
# matches the monitor the substrate chart renders when it owns atelet.
- it: names the monitor after the substrate release
  set:
    metrics.podMonitor.enabled: true
    substrateReleaseName: team
  asserts:
  - equal:
      path: metadata.name
      value: team-atelet

- it: carries the interval and the discovery labels
  set:
    metrics.podMonitor.enabled: true
    metrics.podMonitor.interval: 60s
    metrics.podMonitor.labels:
      release: prometheus
  asserts:
  - equal:
      path: spec.podMetricsEndpoints[0].interval
      value: 60s
  - equal:
      path: metadata.labels.release
      value: prometheus
