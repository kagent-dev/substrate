suite: Pod labels
templates:
- atelet.yaml
tests:
- it: keeps only the app label on the atelet pod by default
  documentSelector:
    path: kind
    value: DaemonSet
  asserts:
  - equal:
      path: spec.template.metadata.labels
      value:
        app: atelet

- it: adds podLabels without changing the DaemonSet selector or labels
  set:
    podLabels:
      example.com/tenant: team-a
      example.com/tier: node
  documentSelector:
    path: kind
    value: DaemonSet
  asserts:
  - equal:
      path: spec.template.metadata.labels
      value:
        app: atelet
        example.com/tenant: team-a
        example.com/tier: node
  - equal:
      path: spec.selector.matchLabels
      value:
        app: atelet
  - equal:
      path: metadata.labels
      value:
        app: atelet

- it: refuses a podLabels entry that replaces the app selector label
  set:
    podLabels:
      app: other
  asserts:
  - failedTemplate:
      errorMessage: "podLabels must not set app: it is the selector label of the atelet DaemonSet"
