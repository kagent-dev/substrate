syntax = "proto3";

package egress;

option go_package = "github.com/agent-substrate/substrate/internal/proto/egresspb";

message EgressPolicy {
  string                    default_action = 1;
  repeated EgressPolicyRule allow          = 2;
  repeated EgressPolicyRule deny           = 3;
  EgressAuditPolicy         audit          = 4;
}

message EgressPolicyRule {
  repeated EgressPolicyDestination to          = 1;
  repeated EgressPort              ports       = 2;
  EgressTLSPolicy                  tls         = 3;
  EgressCredentialPolicy           credentials = 4;
}

message EgressPolicyDestination {
  string host = 1;
  string cidr = 2;
}

message EgressPort {
  uint32 port     = 1;
  string protocol = 2;
}

message EgressTLSPolicy {
  string                   mode      = 1;
  bool                     required  = 2;
  EgressTLSInterceptPolicy intercept = 3;
}

message EgressTLSInterceptPolicy {
  SecretReference issuer_secret_ref = 1;
  bool            validate_upstream = 2;
}

message EgressCredentialPolicy {
  repeated EgressCredentialInjection inject = 1;
}

message EgressCredentialInjection {
  string                    header     = 1;
  EgressCredentialValueFrom value_from = 2;
}

message EgressCredentialValueFrom {
  SecretKeySelector secret_key_ref = 1;
}

message EgressAuditPolicy {
  bool            logs           = 1;
  bool            traces         = 2;
  repeated string redact_headers = 3;
}

message SecretReference {
  string name      = 1;
  string namespace = 2;
}

message SecretKeySelector {
  string name = 1;
  string key  = 2;
}
