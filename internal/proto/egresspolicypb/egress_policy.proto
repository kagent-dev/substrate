syntax = "proto3";

package egresspolicy;

import "pkg/proto/ateapipb/ateapi.proto";

option go_package = "github.com/agent-substrate/substrate/internal/proto/egresspolicypb";

// Resolver is an internal, secret-bearing API used only by the egress gateway.
service Resolver {
  rpc GetEffectiveEgressPolicy(GetEffectiveEgressPolicyRequest) returns (EffectiveEgressPolicy) {}
}

message GetEffectiveEgressPolicyRequest {
  ateapi.ObjectRef actor = 1;
  string actor_uid = 2;
}

message EffectiveEgressPolicy {
  ateapi.EgressPolicy policy = 1;
  repeated ResolvedCredential credentials = 2;
}

message ResolvedCredential {
  string name = 1;
  bytes value = 2;
}
